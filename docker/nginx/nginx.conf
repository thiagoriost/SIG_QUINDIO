worker_processes 1;

events {
    worker_connections 1024;
}

http {

    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;

    large_client_header_buffers 4 32k;
    client_max_body_size 200M;

    server {

        listen 80;

        server_name _;

        # Front Mapoteca
        location /mapoteca/ {

            rewrite ^/mapoteca/(.*)$ /$1 break;

            proxy_pass http://mapoteca-front;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # API Mapoteca
        location /api/mapoteca/ {

            rewrite ^/api/mapoteca/(.*)$ /$1 break;

            proxy_pass http://mapoteca-api:3000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Visit Counter
        location /api/visits/ {

            rewrite ^/api/visits/(.*)$ /api/visits/$1 break;

            proxy_pass http://visit-counter:3002;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Health Visit Counter
        location /api/health {

            proxy_pass http://visit-counter:3002/api/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Visor
        location /visor/ {

            rewrite ^/visor/(.*)$ /$1 break;

            proxy_pass http://visor;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location / {

            proxy_pass http://directus:8055;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

        }

        location /websocket {

            proxy_pass http://directus:8055/websocket;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;

        }

    }

}