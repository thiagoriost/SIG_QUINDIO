worker_processes 1;

events {
    worker_connections 1024;
}

http {

    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;

    large_client_header_buffers 4 32k;
    client_max_body_size 200M;

    server {

        listen 80;

        server_name _;

        # Front Mapoteca
        location /mapoteca/ {

            rewrite ^/mapoteca/(.*)$ /$1 break;

            proxy_pass http://mapoteca-front;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Manejar las rutas de assets que vienen desde el front
        location /assets/ {
            proxy_pass http://mapoteca-front/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Mapoteca
        location /api/v1/mapoteca/ {

            # rewrite ^/api/mapoteca/(.*)$ /$1 break;

            proxy_pass http://mapoteca-api:3000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # location /swagger {
        #     proxy_pass http://mapoteca-api:3000/swagger;
            
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        location /ArchivosQuindioIII/ {
            # Redirige dinámicamente las peticiones de PDFs locales al servidor oficial 
            # para que el visor React funcione perfectamente en tu entorno de desarrollo.
            proxy_pass https://sigquindio.gov.co/ArchivosQuindioIII/;
            
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            add_header Access-Control-Allow-Origin *;
        }

        # Visit Counter
        location /api/visits/ {

            # rewrite ^/api/visits/(.*)$ /api/visits/$1 break;

            proxy_pass http://visit-counter:8055;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Health Visit Counter
        location /api/health {

            proxy_pass http://visit-counter:8055/api/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Visor
        location /visor/ {


            proxy_pass http://visor:80;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

        }
        # Redireccionar las llamadas del CDN relativo que genera el base href
        location /visor/cdn/ {
            proxy_pass http://visor:80/cdn/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # CAPTURA GLOBAL DE CONTINGENCIA: Si las rutas del importmap saltan a la raíz absoluta
        location /cdn/ {
            proxy_pass http://visor:80/cdn/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /jimu-core/ {
            proxy_pass http://visor:80/jimu-core/;
            proxy_set_header Host $host;
        }
        location /jimu-ui/ {
            proxy_pass http://visor:80/jimu-ui/;
            proxy_set_header Host $host;
        }
        location /jimu-icons/ {
            proxy_pass http://visor:80/jimu-icons/;
            proxy_set_header Host $host;
        }
        location /jimu-arcgis/ {
            proxy_pass http://visor:80/jimu-arcgis/;
            proxy_set_header Host $host;
        }
        location /jimu-layouts/ {
            proxy_pass http://visor:80/jimu-layouts/;
            proxy_set_header Host $host;
        }
        location /widgets/ {
            proxy_pass http://visor:80/widgets/;
            proxy_set_header Host $host;
        }
        location /themes/ {
            proxy_pass http://visor:80/themes/;
            proxy_set_header Host $host;
        }

        location / {

            proxy_pass http://directus:8055;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

        }

        location /websocket {

            proxy_pass http://directus:8055/websocket;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;

        }

    }
    server {

        listen 443 ssl;

        server_name _;

        ssl_certificate /etc/nginx/certs/server-cert.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # Front Mapoteca
        location /mapoteca/ {

            rewrite ^/mapoteca/(.*)$ /$1 break;

            proxy_pass http://mapoteca-front;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location /assets/ {
            proxy_pass http://mapoteca-front/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/mapoteca/ {

            proxy_pass http://mapoteca-api:3000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location /ArchivosQuindioIII/ {

            proxy_pass https://sigquindio.gov.co/ArchivosQuindioIII/;

            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            add_header Access-Control-Allow-Origin *;
        }

        location /api/visits/ {

            proxy_pass http://visit-counter:8055;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location /api/health {

            proxy_pass http://visit-counter:8055/api/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location /visor/ {

            proxy_pass http://visor:80;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

        }

        location /visor/cdn/ {
            proxy_pass http://visor:80/cdn/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /cdn/ {
            proxy_pass http://visor:80/cdn/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /jimu-core/ {
            proxy_pass http://visor:80/jimu-core/;
            proxy_set_header Host $host;
        }

        location /jimu-ui/ {
            proxy_pass http://visor:80/jimu-ui/;
            proxy_set_header Host $host;
        }

        location /jimu-icons/ {
            proxy_pass http://visor:80/jimu-icons/;
            proxy_set_header Host $host;
        }

        location /jimu-arcgis/ {
            proxy_pass http://visor:80/jimu-arcgis/;
            proxy_set_header Host $host;
        }

        location /jimu-layouts/ {
            proxy_pass http://visor:80/jimu-layouts/;
            proxy_set_header Host $host;
        }

        location /widgets/ {
            proxy_pass http://visor:80/widgets/;
            proxy_set_header Host $host;
        }

        location /themes/ {
            proxy_pass http://visor:80/themes/;
            proxy_set_header Host $host;
        }

        location /websocket {

            proxy_pass http://directus:8055/websocket;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
        }

        location / {

            proxy_pass http://directus:8055;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

        }

    }

}